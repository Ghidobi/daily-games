# Compila e pubblica una nuova versione quando si carica un tag "v*" (es. con `npm run release`).
# 1) crea una release in bozza  2) compila Windows e la pubblica.
# Gli aggiornamenti automatici (electron-updater) vedono solo le release pubblicate.
# La versione Mac è sospesa: per compilarla a mano su un Mac c'è `npm run dist:mac`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Crea la release in bozza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Daily Games ${GITHUB_REF_NAME#v}" --generate-notes

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Compila e carica sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
